  <meta name="build-date" content="<%= buildDate %>" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="alternate icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"

    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover, interactive-widget=resizes-content" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; media-src 'self' blob: https:; script-src 'self' blob: https://accounts.google.com https://apis.google.com https://ssl.gstatic.com https://esm.sh 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https: https://* blob: *; connect-src 'self' https: wss:;" />
  <title>Elevengram Web</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #1a1a2e;
    }
  </style>

  <!--
    ═══════════════════════════════════════════════════════════
    OTA Redirect & Rollback Safety (Phase 1 & 2)
    ═══════════════════════════════════════════════════════════
    1. Check for stored Vercel URL
    2. Detect "Crash Loop" (3 crashes in 60s)
    3. Redirect immediately to avoid "Banner Loop"
  -->
  <script type="text/javascript">
    (function () {
      const url = localStorage.getItem('ota-target-url');
      if (!url) return;
      
      // If we are already on the target origin, do nothing
      try {
        if (window.location.origin === new URL(url).origin) return;
      } catch (e) { return; }

      // --- IDEA 4: Rollback Safety Net ---
      const now = Date.now();
      const lastCrash = parseInt(localStorage.getItem('ota-last-crash') || '0');
      const crashCount = parseInt(localStorage.getItem('ota-crash-count') || '0');

      if (now - lastCrash < 60000) {
        if (crashCount >= 3) {
          console.error('[OTA] Crash Loop detected — rolling back to APK');
          localStorage.removeItem('ota-target-url');
          localStorage.removeItem('ota-crash-count');
          return;
        }
        localStorage.setItem('ota-crash-count', (crashCount + 1).toString());
      } else {
        localStorage.setItem('ota-crash-count', '1');
      }
      localStorage.setItem('ota-last-crash', now.toString());
      // -----------------------------------

      console.log('[OTA] Early redirect to:', url);
      window.location.replace(url);
    })();
  </script>

  <!--
    ═══════════════════════════════════════════════════════════
    GitHub Pages SPA redirect (existing — untouched)
    ═══════════════════════════════════════════════════════════
  -->
  <script type="text/javascript">
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
</head>

<body>
  <!-- Initial loading state handled by React -->

  <div id="root"></div>
  <script type="module" src="src/main.jsx"></script>
</body>
