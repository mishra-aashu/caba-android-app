<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="build-time" content="<%= buildTime %>" />
  <meta name="build-date" content="<%= buildDate %>" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="alternate icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover, interactive-widget=resizes-content" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; media-src 'self' blob: https:; script-src 'self' blob: https://accounts.google.com https://apis.google.com https://ssl.gstatic.com https://esm.sh 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https: https://* blob: *; connect-src 'self' https: wss:;" />
  <title>Elevengram Web</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #1a1a2e;
    }
  </style>

  <!--
    ═══════════════════════════════════════════════════════════
    OTA Redirect & Rollback Safety (Phase 1 & 2)
    ═══════════════════════════════════════════════════════════
-->
</head>

<body>
  <!-- 
      🛡️ OTA ROOT PROXY (Mirror Vercel to Localhost)
      Registers the SW-Proxy early if an OTA build is selected.
    -->
  <script type="text/javascript">
    (function () {
      const ACTIVE_BUILD = 'ota-active-build';
      if (localStorage.getItem(ACTIVE_BUILD) && 'serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw-proxy.js', { scope: '/' })
          .catch(err => console.log('[OTA] Proxy registration skipped:', err.message));
        console.log('[OTA] 🛡️ Root Proxy active for build:', localStorage.getItem(ACTIVE_BUILD));
      }
    })();
  </script>

  <!-- Initial loading state handled by React -->

  <!-- Main App -->
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
