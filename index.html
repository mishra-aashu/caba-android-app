<!doctype html>
<html lang="en">

<head>
  <!-- 
    OTA EARLY REDIRECT (Instant Boot)
    Moved to top of head to execute before ANY rendering.
    Redirects to Vercel instantly if an update was previously received.
    Redirects to Vercel instantly if an update was previously received.
  -->
  <script>
    // OTA CLEANUP: Remove any stale ota-target-url saved by the old system.
    // Previously, the app saved Vercel's URL to localStorage and redirected
    // to it on every cold start. This caused "webpage not available" offline.
    // The new system only does a session-only redirect (never saves the URL).
    // This cleanup runs once per launch to fix already-affected devices.
    (function() {
      try {
        if (localStorage.getItem('ota-target-url')) {
          localStorage.removeItem('ota-target-url');
          console.log('[OTA] Cleaned up stale ota-target-url from localStorage');
        }
      } catch(e) {}
    })();
  </script>

  <meta charset="UTF-8" />
  <meta name="build-time" content="<%= buildTime %>" />
  <meta name="build-date" content="<%= buildDate %>" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="alternate icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover, interactive-widget=resizes-content" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; worker-src 'self' blob:; media-src 'self' blob: https:; script-src 'self' blob: https://accounts.google.com https://apis.google.com https://ssl.gstatic.com https://esm.sh 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https: https://* blob: *; connect-src 'self' blob: https: wss:;" />
  <title>Elevengram Web</title>

  <style>
    html, body { margin: 0; padding: 0; background: #0b141a; }
  </style>

  <script type="text/javascript">
    // GitHub Pages SPA redirect
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
</head>

<body>

  <div id="root">
    <!-- 
      INSTANT DARK BOOT
      Vite loader is hidden until React mounts.
      Background is pitch black to match the Cinematic Intro.
    -->
    <style>
      .boot-loader {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background-color: #0b141a;
        z-index: 9999;
      }
    </style>
    <div class="boot-loader"></div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
