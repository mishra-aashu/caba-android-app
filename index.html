<!doctype html>
<html lang="en">

<head>
  <!-- 
    OTA EARLY REDIRECT (Instant Boot)
    Moved to top of head to execute before ANY rendering.
    Redirects to Vercel instantly if an update was previously received.
  -->
  <script>
    (function() {
      try {
        var host = window.location.hostname;
        var proto = window.location.protocol;
        var isLocal = host === 'localhost' || host === '' || proto === 'capacitor:' || proto === 'file:';
        if (!isLocal) return;

        var target = localStorage.getItem('ota-target-url');
        if (!target) return;

        // Origin check to prevent loops
        try {
          if (window.location.origin === new URL(target).origin) return;
        } catch(e) {
          localStorage.removeItem('ota-target-url');
          return;
        }

        // Silent Redirect — no splash screen needed because we are in <head>
        window.location.replace(target);
      } catch(e) {}
    })();
  </script>

  <meta charset="UTF-8" />
  <meta name="build-time" content="<%= buildTime %>" />
  <meta name="build-date" content="<%= buildDate %>" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="alternate icon" href="/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0, viewport-fit=cover, interactive-widget=resizes-content" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; worker-src 'self' blob:; media-src 'self' blob: https:; script-src 'self' blob: https://accounts.google.com https://apis.google.com https://ssl.gstatic.com https://esm.sh 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https: https://* blob: *; connect-src 'self' https: wss:;" />
  <title>Elevengram Web</title>

  <style>
    html, body { margin: 0; padding: 0; background: #1a1a2e; }
  </style>

  <script type="text/javascript">
    // GitHub Pages SPA redirect
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
</head>

<body>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
