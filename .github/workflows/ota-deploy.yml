name: Deploy OTA Update

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm ci

      - name: Build the React App
        run: npm run build

      - name: Create Bundle and Upload to GitHub Release
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # 1. Extract Version and Timestamp
          VERSION=$(node -p "require('./package.json').version")
          TIMESTAMP=$(date +%s)
          ZIP_NAME="ota-$VERSION-$TIMESTAMP.zip"
          TAG_NAME="ota-$VERSION-$TIMESTAMP"

          # 2. Create ZIP
          cd dist && zip -r ../$ZIP_NAME . && cd ..

          # 3. Create GitHub Release and Upload ZIP
          gh release create $TAG_NAME $ZIP_NAME --title "OTA Update $VERSION" --notes "Automated OTA build"
          
          # 4. Construct Public Download URL
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/$ZIP_NAME"
          
          # 5. Update Supabase Database
          node scripts/update-db.js $VERSION $TIMESTAMP $DOWNLOAD_URL

          # 6. Cleanup: Keep only the latest 5 OTA releases to save space
          echo "🧹 Cleaning up old OTA releases..."
          RELEASE_TAGS=$(gh release list --limit 100 | grep "^ota-" | awk '{print $1}')
          COUNT=0
          for TAG in $RELEASE_TAGS; do
            COUNT=$((COUNT+1))
            if [ $COUNT -gt 5 ]; then
              echo "🗑️ Deleting old release: $TAG"
              gh release delete "$TAG" --yes --cleanup-tag
            fi
          done
